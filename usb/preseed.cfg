# Debian Automated Headless Preseed Configuration
# Target: Intel NUC Fleet (NUC11, NUC13, and generic amd64 nodes)

# 1. Localization & Keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i console-setup/ask_detect boolean false
d-i keyboard-configuration/xkb-keymap select us

# 2. Network Configuration
d-i netcfg/choose_interface select auto
# Prompt only for the hostname during install (e.g. nuc02, nuc03)
d-i netcfg/get_hostname string unassigned-node
d-i netcfg/get_hostname seen false
d-i netcfg/get_domain string 

# 3. Mirror Settings
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string 

# 4. Clock & Timezone
d-i clock-setup/utc boolean true
d-i time/zone string America/Los_Angeles
d-i clock-setup/ntp boolean true

# 5. Partitioning (Auto-partition entire primary disk)
# Assumes every fleet node has a single NVMe drive as the install target;
# pins it explicitly so partman never prompts "which disk to partition".
d-i partman-auto/disk string /dev/nvme0n1
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# 6. User Account (mstouffer)
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Mark Stouffer
d-i passwd/username string mstouffer
d-i passwd/user-password password debian
d-i passwd/user-password-again password debian

# 7. Package Selection (Minimal Headless + SSH + Avahi)
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server avahi-daemon sudo curl wget build-essential rsync ca-certificates gnupg fzf
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# 8. Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

# 9. Finish & Reboot
d-i finish-install/reboot_in_progress note

# 10. Late Command: Inject SSH Keys, Configure Passwordless Sudo, Enable Services
d-i preseed/late_command string \
    in-target sh -c "echo 'mstouffer ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/mstouffer && chmod 0440 /etc/sudoers.d/mstouffer"; \
    in-target mkdir -p /home/mstouffer/.ssh; \
    in-target sh -c "echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG+3AQPlULPt5aoTU9iFK9gFeBete4mEEkuAbaubwVIK xgenx@DESKTOP-NU23FHO' >> /home/mstouffer/.ssh/authorized_keys"; \
    in-target sh -c "echo 'ssh-rsa  mstouffer@DESKTOP-NU23FHO' >> /home/mstouffer/.ssh/authorized_keys"; \
    in-target chmod 700 /home/mstouffer/.ssh; \
    in-target chmod 600 /home/mstouffer/.ssh/authorized_keys; \
    in-target chown -R mstouffer:mstouffer /home/mstouffer/.ssh; \
    in-target timedatectl set-timezone America/Los_Angeles; \
    in-target systemctl enable avahi-daemon
