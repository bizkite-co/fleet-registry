# Custom GRUB boot entry for the Debian installer USB.
# Paste this menuentry into usb/boot/grub/grub.cfg (inside the top-level
# menu, alongside the stock "Graphical install" / "Install" entries)
# whenever the USB is rebuilt from a fresh Debian netinst ISO.
#
# priority=high (not "critical"): critical suppresses every debconf
# question below critical priority, including netcfg/get_hostname even
# with "seen false" set in preseed.cfg -- so the installer silently used
# the default hostname instead of prompting. high still auto-answers
# every other question from preseed.cfg (all preseeded values are marked
# seen=true by default) but lets the explicitly-unseen hostname question
# through, so each node gets prompted once during install.
menuentry --hotkey=a 'Automated Headless Install (Preseed)' {
    set background_color=black
    linux    /install.amd/vmlinuz auto=true priority=high preseed/file=/cdrom/preseed.cfg --- quiet
    initrd   /install.amd/initrd.gz
}
