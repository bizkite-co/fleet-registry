[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleet-registry"
version = "0.1.1"
description = "Inventory, audit, and provisioning CLI + TUI for a homelab fleet of Linux nodes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Mark Stouffer" }
]
dependencies = [
    "pydantic>=2.7",
    "rich>=13.7",
    "textual>=0.80",
    "typer>=0.12",
    "verkit>=0.2.1",
]

[project.scripts]
fleet-registry = "fleet_registry.cli:main"
fr = "fleet_registry.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_registry"]

# Keep the sdist to code only: inventory/devices.json holds MACs and IPs and
# must never ship to PyPI.
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
